services:
  db:
    image: postgres:16-alpine
    container_name: lead-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: lead_crm
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d lead_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
